version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: devconnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devconnect
      POSTGRES_PASSWORD: devconnect123
      POSTGRES_DB: devconnect
    ports:
      - "5432:5432"
    volumes:
      - devconnect_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: devconnect_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  coturn:
    image: coturn/coturn
    container_name: devconnect_coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"

volumes:
  devconnect_pgdata:
